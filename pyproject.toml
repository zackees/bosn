[project]
name = "bosn"
version = "0.1.4"
description = "Let your agents use Docker all day without filling the disk"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Zach Vorhies" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/zackees/bosn"

# No [project.scripts]: the `bosn` command is the native binary itself, staged
# into the wheel's .data/scripts by bosn_build_backend (see AGENTS.md, #262).

[dependency-groups]
dev = [
    "maturin>=1.15,<2",
    "pyyaml==6.0.2",
    "pytest>=8.0",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

# Target state is `build-backend = "soldr"` (soldr's own dogfooded pattern), but
# soldr's native build has no hook to build and bundle Bosn's separate
# `bosn-native` CLI binary into the wheel — only the maturin extension. Until
# soldr grows auxiliary-binary staging (tracked in zackees/soldr#3239),
# bosn_build_backend stays the PEP 517 backend: it builds and stages the CLI,
# then delegates the extension build to maturin.
[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "bosn_build_backend"
backend-path = ["."]

[tool.maturin]
manifest-path = "crates/bosn-python/Cargo.toml"
module-name = "bosn._native"
python-source = "src"
data = "target/bosn-wheel-data"
targets = [
    { name = "bosn_native", kind = "cdylib" },
]
include = [
    { path = "bosn_build_backend.py", format = "sdist" },
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "ci"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests", "ci"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
reportMissingImports = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docker: test requires a reachable Docker engine (Linux CI only)",
    "slow: test spawns real processes or builds images",
]
