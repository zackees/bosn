[workspace]
members = ["crates/bosn", "crates/bosn-core", "crates/bosn-engine", "crates/bosn-generation", "crates/bosn-registry", "crates/bosn-service", "crates/bosn-python", "crates/bosn-setup"]
resolver = "3"
# The desktop widget links a webview toolkit; it builds on its own so the CLI,
# daemon and CI never link WebKitGTK, WebView2 or AppKit.
exclude = ["crates/bosn-widget"]

# The release version, and the only place it is written. `./bump` edits it;
# `bosn` (crates.io) and `bosn-python` (PyPI, via maturin's dynamic version)
# inherit it. The internal crates are never published and keep their own.
[workspace.package]
version = "0.1.14"

[workspace.lints.clippy]
cognitive_complexity = "warn"
too_many_lines = "warn"
