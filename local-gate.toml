# Shared CI tool policy for Bosn (zackees/ci.yml#362).
# Run from a clean committed tree before pushing:
# uvx --from git+https://github.com/zackees/ci.yml@96ba9f2df5b6c16d4fc933ee9dc2dbab7c47b46e ci-lint local-gate run
# The shared verifier proves source checks and provider identity, then writes
# Local-Gate and per-gate Ci-Attestation trailers. Bosn supplies raw receipts.
[gate]
run = ["bosn", "ci", "run", "--workspace", ".", "--workflow", ".github/workflows/ci.yml", "--event", "workflow_dispatch", "--input", "tier=test", "--mode", "minimal", "--engine", "act", "--timeout-secs", "3600", "--wait", "--deadline-ms", "3600000", "--json", "--ci-output", "verify:skip_rust", "--ci-output", "select-tier:test"]
verify = "ci.yml:verify"
verify-exempt = ["ci-pre"]
mode = "enforce"

[gate.isolation]
marker = "BOSN_TEST_ISOLATED"
runner = ["bosn", "ci", "run"]
proves-tree = true
guard = "tests/conftest.py"

# The two workflow selections preserve all former checks: Linux runs Python
# static checks, repository guards, shared policy lint, unit and Docker tests;
# Rust runs both rustfmt scopes, Clippy, boundary/metadata and workspace tests.
# No exclusions until measured input evidence establishes narrower safe keys.
[gate.lanes.rust]
run = ["bosn", "ci", "run", "--workspace", ".", "--workflow", ".github/workflows/ci.yml", "--event", "workflow_dispatch", "--input", "tier=test", "--mode", "minimal", "--engine", "act", "--timeout-secs", "3600", "--wait", "--deadline-ms", "3600000", "--json", "--ci-output", "verify:skip_rust", "--ci-output", "select-tier:test", "--job", "rust"]
tools = ["bosn", "docker", "uv", "python"]

# GATE-007 `light`: this lane runs concurrently with the heavy Rust lane
# instead of after it (bosn#503). Both execute in their own isolated engines;
# measured on one tree, sequential 704 s vs concurrent 388 s.
[gate.lanes.tests]
weight = "light"
run = ["bosn", "ci", "run", "--workspace", ".", "--workflow", ".github/workflows/ci.yml", "--event", "workflow_dispatch", "--input", "tier=test", "--mode", "minimal", "--engine", "act", "--timeout-secs", "3600", "--wait", "--deadline-ms", "3600000", "--json", "--ci-output", "verify:skip_rust", "--ci-output", "select-tier:test", "--job", "linux"]
tools = ["bosn", "docker", "uv", "python"]

[gate.replay]
repository = "zackees/bosn"
workflow = "ci.yml"
mode = "minimal"
report-source = "stdout"
qualified = true
provider-query = ["bosn", "ci", "runners", "list", "--json"]

[[gate.replay.jobs]]
source-job = "ci.yml:verify"
lanes = ["rust", "tests"]

[[gate.replay.jobs]]
source-job = "ci.yml:rust"
lanes = ["rust"]

[[gate.replay.jobs]]
source-job = "ci.yml:select-tier"
lanes = ["tests"]

[[gate.replay.jobs]]
source-job = "ci.yml:linux"
lanes = ["tests"]

[[gate.replay.selections]]
lane = "rust"
job = "rust"
event = "workflow_dispatch"
inputs = { tier = "test" }

[[gate.replay.selections]]
lane = "tests"
job = "linux"
event = "workflow_dispatch"
inputs = { tier = "test" }

# Read from the PR base; changed policy/workflow surfaces, missing proof,
# forks, full labels and audit samples fail closed to ordinary remote checks.
# Default-branch and release coverage remain remote.
[gate.trust]
mode = "enforce"
skip = ["ci.yml:lint-no-macos-runners", "ci.yml:rust"]
covered-by = { "ci.yml:lint-no-macos-runners" = ["tests"], "ci.yml:rust" = ["rust"] }
surfaces = []
