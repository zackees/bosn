name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every lane only reads the checkout; none publishes anything.
permissions:
  contents: read

jobs:
  linux:
    name: Linux (lint + unit + docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Docker engine version
        run: docker version

      - name: Install
        run: ./install

      - name: Lint
        run: ./lint

      - name: Test (unit + docker)
        run: ./test

      - name: Build wheel
        run: uv build --wheel

      - name: Assert native wheel contents
        run: |
          set -e
          ls dist/
          wheel="$(ls dist/*.whl)"
          uv run python - "$wheel" <<'PY'
          import sys
          import zipfile

          names = zipfile.ZipFile(sys.argv[1]).namelist()
          assert any(
              name.startswith("bosn/_native.")
              and name.rsplit(".", 1)[-1] in {"so", "pyd", "dylib"}
              for name in names
          ), names
          PY
