name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every lane only reads the checkout; none publishes anything.
permissions:
  contents: read

jobs:
  lint-no-macos-runners:
    name: CI policy (no hosted macOS runners)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Refuse native macOS runner labels
        run: uv run python ci/lint_no_macos_runners.py

  rust:
    name: Rust workspace (locked tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - name: Set up Python for PyO3 tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore Cargo build cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-workspace-v1

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes pkg-config libssl-dev

      - name: Verify kernal-api boundary and locked resolution
        run: |
          python3 ci/verify_kernel_boundary.py
          cargo metadata --locked --format-version 1 --no-deps > /dev/null

      # Deliberately does not include --ignored: Docker and Hermes acceptance
      # cases retain their explicit opt-in prerequisites and dedicated proofs.
      # The extension-module feature leaves CPython symbols for a wheel host;
      # unit tests instead link the selected CPython explicitly.
      - name: Test Rust workspace
        run: |
          cargo test --workspace --exclude bosn --locked
          PYO3_PYTHON="$(command -v python)" cargo test -p bosn --lib --locked --no-default-features --features embedded-python-tests

  linux:
    name: Linux (lint + unit + docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Docker engine version
        run: docker version

      - name: Install
        run: ./install

      - name: Lint
        run: ./lint

      - name: Test (unit + docker)
        run: ./test


  native-wheel:
    name: Native wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Provide OpenSSL to Cargo (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkg) { $vcpkg = 'C:\vcpkg' }
          & "$vcpkg\vcpkg.exe" install openssl:x64-windows
          "VCPKG_ROOT=$vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # This matrix intentionally has no Docker setup or Docker invocation.
      # The Linux job above remains the dedicated Docker integration lane.
      - name: Build platform wheel
        run: uv build --wheel --out-dir dist

      - name: Install and smoke-test platform wheel outside the checkout
        run: python ci/verify_installed_wheel.py "dist/bosn-*.whl"

  darwin-cross-wheel:
    name: Darwin wheel (${{ matrix.target }}, Linux-hosted Soldr)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            deployment_target: "10.12"
          - target: aarch64-apple-darwin
            deployment_target: "11.0"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      # Pinned setup-soldr v0. The action supplies Soldr's blessed LLVM 21.1.5
      # and Apple SDK 14.5, not a host macOS runner or zig/osxcross fallback.
      - name: Set up Soldr Darwin target
        uses: zackees/setup-soldr@bb28e96d2dc32c058242f56722297caf1efcbd90
        with:
          cache: false
          cross-targets: ${{ matrix.target }}

      - name: Export Soldr target environment
        run: soldr prepare --target "${{ matrix.target }}" --github-env "$GITHUB_ENV"

      # Maturin invokes Cargo directly through the PEP 517 backend.  Ensure
      # that the runner's pinned Rust toolchain has the same std component
      # Soldr prepared, rather than relying on a host default target set.
      - name: Install Rust standard library for Darwin target
        run: rustup target add "${{ matrix.target }}" --toolchain 1.95.0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build Darwin wheel on Linux
        env:
          BOSN_WHEEL_TARGET: ${{ matrix.target }}
          PYO3_CROSS_PYTHON_VERSION: "3.10"
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
        run: uv build --wheel --out-dir dist

      - name: Verify Darwin wheel statically on Linux
        run: >-
          python ci/verify_cross_wheel.py "dist/bosn-*.whl"
          --target "${{ matrix.target }}"

      - name: Upload Darwin wheel
        uses: actions/upload-artifact@v4
        with:
          name: bosn-wheel-${{ matrix.target }}
          path: dist/bosn-*.whl
          if-no-files-found: error
