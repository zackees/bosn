name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every lane only reads the checkout; none publishes anything.
permissions:
  contents: read

jobs:
  linux:
    name: Linux (lint + unit + docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Docker engine version
        run: docker version

      - name: Install
        run: ./install

      - name: Lint
        run: ./lint

      - name: Test (unit + docker)
        run: ./test

      - name: Build wheel
        run: uv build --wheel

      - name: Assert py3-none-any wheel
        run: |
          set -e
          ls dist/
          test -n "$(ls dist/*-py3-none-any.whl)"

  native:
    name: ${{ matrix.name }} (lint + unit)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: ./install

      # Temporary: issue #68. process_alive(4) disagrees between a dev box and this runner,
      # and the wrong answer means a live holder's lease can be reaped. Print the evidence
      # rather than guess. Remove this step once the behavior is recorded on the issue.
      - name: Diagnose PID-4 liveness (issue #68)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: uv run python ci/diagnose_pid4.py

      - name: Lint
        run: ./lint

      - name: Test (unit)
        run: ./test
