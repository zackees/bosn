name: CI
# A full-tier dispatch is named for its candidate: ci/release_gate.py accepts
# only a green run named `CI full <SHA>` as the release proof for <SHA>.
run-name: ${{ inputs.tier == 'full' && inputs.commit_sha && format('CI full {0}', inputs.commit_sha) || github.event.pull_request.title || github.event.head_commit.message || 'CI' }}

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      tier:
        description: "CI tier; hosted macOS smoke runs only for full"
        type: choice
        options: [minimal, test, full]
        default: minimal
      commit_sha:
        description: "Candidate commit SHA to check out (required for full)"
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Every lane only reads the checkout; none publishes anything.
permissions:
  contents: read

jobs:
  # GATE-002/003 (zackees/ci.yml#166, bosn#361): the head commit carries a
  # tree-bound `Local-Gate:` attestation from `ci-lint local-gate run`
  # (local-gate.toml), and every other job needs this one. It supersedes the
  # former GEN-021 shadow reuse report: attestations are the authoritative
  # record of what passed locally. mode = shadow (local-gate.toml): a missing
  # or stale attestation is reported, not enforced, until `first-pass` shows
  # attested heads are the norm.
  verify:
    name: Verify local gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      attested: ${{ steps.verify.outputs.attested }}
      state: ${{ steps.verify.outputs.state }}
      trusted: ${{ steps.verify.outputs.trusted }}
      trust_reason: ${{ steps.verify.outputs.trust_reason }}
      # GATE-010: true only when the head passes [gate.trust] and attests
      # every gate ci-attestations.yml maps to the job (never in shadow).
      skip_rust: ${{ steps.verify.outputs.skip_rust }}
      skip_lint-no-macos-runners: ${{ steps.verify.outputs.skip_lint-no-macos-runners }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout CI policy
        uses: actions/checkout@v4
        with:
          repository: zackees/ci.yml
          ref: 96ba9f2df5b6c16d4fc933ee9dc2dbab7c47b46e
          path: .ci-lint
          persist-credentials: false
          sparse-checkout: ci_lint
      - name: Verify the local-gate attestation and decide attested skips
        id: verify
        run: PYTHONPATH=.ci-lint python3 -m ci_lint local-gate verify --repo . --trust --github-output

  # GATE-010 side entries: publish each valid Ci-Attestation of this commit
  # as its own tiny lineage-keyed cache entry. Nothing waits on it.
  ci-pre:
    uses: ./.github/workflows/ci-pre.yml
    permissions:
      contents: read

  select-tier:
    name: Select CI tier
    needs: [verify]
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.select.outputs.tier }}
      test: ${{ steps.select.outputs.test }}
      full: ${{ steps.select.outputs.full }}
      widget: ${{ steps.select.outputs.widget }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.event.pull_request.head.sha || github.sha }}
          # History for the widget path diff against the PR base / push before.
          fetch-depth: 0
          persist-credentials: false
      - name: Select CI tier
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PATH: ${{ github.event_path }}
          MANUAL_TIER: ${{ inputs.tier }}
          MANUAL_SHA: ${{ inputs.commit_sha }}
        run: >-
          python3 ci/select_ci_tier.py --event "$EVENT_NAME"
          --payload "$EVENT_PATH" --manual-tier "${MANUAL_TIER:-minimal}"
          --manual-sha "$MANUAL_SHA"
          --output "$GITHUB_OUTPUT"

  lint-no-macos-runners:
    # Legacy required-check name in branch protection. The implementation now
    # permits hosted Macs only in ci-full and release; keep this status stable.
    name: CI policy (no hosted macOS runners)
    needs: [verify]
    # GATE-008/010: skipped only for an attested, trusted PR head.
    if: needs.verify.outputs.skip_lint-no-macos-runners != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Check hosted macOS runner scope
        # This policy needs only PyYAML.  Keep it independent from the Rust
        # extension build so it can fail immediately before build capacity is
        # spent on any wheel lane.
        run: uv run --no-project --with pyyaml==6.0.2 python ci/lint_no_macos_runners.py

  rust:
    name: Rust workspace (locked tests)
    needs: [verify]
    # GATE-008/010: skipped only for an attested, trusted PR head.
    if: needs.verify.outputs.skip_rust != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python for PyO3 tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv for isolated compiler fixtures
        uses: astral-sh/setup-uv@v5

      - name: Set up Soldr
        uses: zackees/setup-soldr@v0
        with:
          version: "0.9.27"
          cache: true
          job-status: ${{ job.status }}
          save-cache: auto
          save-cache-remote: ${{ github.ref == 'refs/heads/main' && 'auto' || 'false' }}
          # CACHE-024 (setup-soldr#552): the sanctioned automatic key. Under
          # act it saves per source, so workspace units accumulate (#503).
          key: auto
          target-cache: false
          cargo-registry-cache: false
          prebuild-deps: none
          # A restored solo snapshot can lack the on-demand Clippy binary.
          solo-toolchain-cache: "false"

      # No hand-keyed target cache (#361 phase 3): the former
      # Swatinem/rust-cache `rust-workspace-v1` key was invalidated by hand.
      # Compiled artifacts come from setup-soldr's content-keyed zccache
      # build cache above (nearest-ancestor restore per zackees/ci.yml
      # CACHE-024), and an attested PR head skips this job altogether.

      # No apt-get (#600): pkg-config and libssl-dev ship in both GitHub's
      # ubuntu-latest image and bosn's pinned act runner image.

      - name: Rust format and Clippy
        run: |
          soldr cargo fmt --all --check
          soldr cargo fmt --check --manifest-path crates/bosn-widget/Cargo.toml
          soldr cargo clippy --workspace --exclude bosn-python --all-targets --locked -- -D warnings

      - name: Verify kernal-api boundary and locked resolution
        run: |
          python3 ci/verify_kernel_boundary.py
          soldr cargo metadata --locked --format-version 1 --no-deps > /dev/null

      # Deliberately does not include --ignored: Docker and Hermes acceptance
      # cases retain their explicit opt-in prerequisites and dedicated proofs.
      # The extension-module feature leaves CPython symbols for a wheel host;
      # unit tests instead link the selected CPython explicitly.
      - name: Test Rust workspace
        run: |
          # nextest runs every test binary in parallel (#600); it cannot run
          # doctests, so they run separately and nothing is dropped.
          soldr cargo nextest run --workspace --exclude bosn-python --locked
          soldr cargo test --workspace --exclude bosn-python --doc --locked
          PYO3_PYTHON="$(command -v python)" soldr cargo test -p bosn-python --lib --locked --no-default-features --features embedded-python-tests

  linux:
    name: Linux (lint + unit + docker)
    if: ${{ !cancelled() }}
    needs: [select-tier]
    runs-on: ubuntu-latest
    steps:
      # A skipped required check can satisfy branch protection. Fail explicitly
      # if the selector failed or returned an unknown/inconsistent tier.
      - name: Verify selected CI tier
        if: always()
        shell: bash
        env:
          SELECT_RESULT: ${{ needs.select-tier.result }}
          CI_TIER: ${{ needs.select-tier.outputs.tier }}
          RUN_TESTS: ${{ needs.select-tier.outputs.test }}
          RUN_FULL: ${{ needs.select-tier.outputs.full }}
        run: |
          if [[ "$SELECT_RESULT" != success ]]; then
            echo "CI tier selection failed: $SELECT_RESULT" >&2
            exit 1
          fi
          case "$CI_TIER:$RUN_TESTS:$RUN_FULL" in
            minimal:false:false|test:true:false|full:true:true) ;;
            *) echo "Invalid CI tier selection" >&2; exit 1 ;;
          esac

      - name: Minimal tier required-check placeholder
        if: needs.select-tier.outputs.test != 'true'
        run: echo "Linux integration runs in test and full CI"

      - name: Checkout source
        uses: actions/checkout@v4
        if: needs.select-tier.outputs.test == 'true'
        with:
          ref: ${{ inputs.commit_sha || github.event.pull_request.head.sha || github.sha }}

      - name: Install uv
        if: needs.select-tier.outputs.test == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Docker engine version
        if: needs.select-tier.outputs.test == 'true'
        run: docker version

      - name: Set up Soldr for Linux checks
        if: needs.select-tier.outputs.test == 'true'
        uses: zackees/setup-soldr@v0
        with:
          version: "0.9.27"
          cache: true
          # Fork the restored Rust foundation so wheel units can be saved too.
          cache-key-suffix: linux-gate
          job-status: ${{ job.status }}
          save-cache: auto
          save-cache-remote: ${{ github.ref == 'refs/heads/main' && 'auto' || 'false' }}
          # CACHE-024 (setup-soldr#552): the sanctioned automatic key. Under
          # act it saves per source, so workspace units accumulate (#503).
          key: auto
          target-cache: false
          cargo-registry-cache: false
          prebuild-deps: none

      - name: Install
        if: needs.select-tier.outputs.test == 'true'
        # No apt-get (#600): pkg-config and libssl-dev ship in both runner
        # images, and patchelf comes from the wheel's build requirements.
        run: ./install

      - name: Lint
        if: needs.select-tier.outputs.test == 'true'
        run: ./lint

      - name: Validate shared local-gate policy
        if: needs.select-tier.outputs.test == 'true'
        run: uvx --from git+https://github.com/zackees/ci.yml@96ba9f2df5b6c16d4fc933ee9dc2dbab7c47b46e --with pyyaml==6.0.2 ci-lint local-gate lint

      - name: Test (unit + docker)
        if: needs.select-tier.outputs.test == 'true'
        run: ./test


  native-wheel:
    name: Native wheel (${{ matrix.os }})
    if: ${{ !cancelled() }}
    needs: [select-tier]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11"]
    steps:
      - name: Verify selected CI tier
        if: always()
        shell: bash
        env:
          SELECT_RESULT: ${{ needs.select-tier.result }}
          CI_TIER: ${{ needs.select-tier.outputs.tier }}
          RUN_TESTS: ${{ needs.select-tier.outputs.test }}
          RUN_FULL: ${{ needs.select-tier.outputs.full }}
        run: |
          if [[ "$SELECT_RESULT" != success ]]; then
            echo "CI tier selection failed: $SELECT_RESULT" >&2
            exit 1
          fi
          case "$CI_TIER:$RUN_TESTS:$RUN_FULL" in
            minimal:false:false|test:true:false|full:true:true) ;;
            *) echo "Invalid CI tier selection" >&2; exit 1 ;;
          esac

      # Branch protection requires each concrete matrix cell on every PR SHA.
      - name: Minimal tier required-check placeholder
        if: needs.select-tier.outputs.full != 'true'
        run: echo "Native wheel build runs in full CI"

      - uses: actions/checkout@v4
        if: needs.select-tier.outputs.full == 'true'
        with:
          ref: ${{ inputs.commit_sha || github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python ${{ matrix.python }}
        if: needs.select-tier.outputs.full == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Set up Rust
        if: needs.select-tier.outputs.full == 'true'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - name: Install uv
        if: needs.select-tier.outputs.full == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Soldr for the wheel backend
        if: needs.select-tier.outputs.full == 'true'
        uses: zackees/setup-soldr@fe965fc7e2c5203570072e1d0fd19d0935d98e39
        with:
          version: "0.9.27"
          toolchain: "1.95.0"
          prebuild-deps: none

      # No OpenSSL bootstrap on Windows: kernal-api's http-client uses reqwest
      # default-tls, which is native-tls/SChannel on MSVC, so openssl-sys is not
      # in the Windows graph (soldr#3231). ci/lint_no_vcpkg_bootstrap.py guards it.
      # This matrix intentionally has no Docker setup or Docker invocation.
      # The Linux job above remains the dedicated Docker integration lane.
      - name: Build platform wheel
        if: needs.select-tier.outputs.full == 'true'
        run: uv build --wheel --out-dir dist

      - name: Install and smoke-test platform wheel outside the checkout
        if: needs.select-tier.outputs.full == 'true'
        run: python ci/verify_installed_wheel.py "dist/bosn-*.whl"

      # The macOS Recovery lane (macos-x64-execute.yml) has no uv and no
      # network, so it installs with the interpreter's own pip, offline.
      # Exercise that exact path here on every run so the advisory lane never
      # fails for a verifier reason the gating lanes would have caught.
      - name: Smoke-test the wheel through the offline pip installer path
        if: needs.select-tier.outputs.full == 'true' && runner.os == 'Linux'
        run: python ci/verify_installed_wheel.py --installer pip "dist/bosn-*.whl"

  darwin-cross-wheel:
    name: Darwin wheel (${{ matrix.target }}, Linux-hosted Soldr)
    if: ${{ !cancelled() }}
    needs: [select-tier]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            deployment_target: "10.12"
          - target: aarch64-apple-darwin
            deployment_target: "11.0"
    steps:
      - name: Verify selected CI tier
        if: always()
        shell: bash
        env:
          SELECT_RESULT: ${{ needs.select-tier.result }}
          CI_TIER: ${{ needs.select-tier.outputs.tier }}
          RUN_TESTS: ${{ needs.select-tier.outputs.test }}
          RUN_FULL: ${{ needs.select-tier.outputs.full }}
        run: |
          if [[ "$SELECT_RESULT" != success ]]; then
            echo "CI tier selection failed: $SELECT_RESULT" >&2
            exit 1
          fi
          case "$CI_TIER:$RUN_TESTS:$RUN_FULL" in
            minimal:false:false|test:true:false|full:true:true) ;;
            *) echo "Invalid CI tier selection" >&2; exit 1 ;;
          esac

      # Preserve both required target contexts even when the full tier is off.
      - name: Minimal tier required-check placeholder
        if: needs.select-tier.outputs.full != 'true'
        run: echo "Darwin wheel build runs in full CI"

      - uses: actions/checkout@v4
        if: needs.select-tier.outputs.full == 'true'
        with:
          ref: ${{ inputs.commit_sha || github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python 3.11
        if: needs.select-tier.outputs.full == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Rust
        if: needs.select-tier.outputs.full == 'true'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      # Pinned setup-soldr v0. The action supplies Soldr's blessed LLVM 21.1.5
      # and Apple SDK 14.5, not a host macOS runner or zig/osxcross fallback.
      - name: Set up Soldr Darwin target
        if: needs.select-tier.outputs.full == 'true'
        uses: zackees/setup-soldr@v0 # v0.9.82 or later (floating major)
        with:
          cache: false
          cross-targets: ${{ matrix.target }}

      - name: Export Soldr target environment
        if: needs.select-tier.outputs.full == 'true'
        run: soldr prepare --target "${{ matrix.target }}" --github-env "$GITHUB_ENV"

      # Maturin invokes Cargo directly through the PEP 517 backend.  Ensure
      # that the runner's pinned Rust toolchain has the same std component
      # Soldr prepared, rather than relying on a host default target set.
      - name: Install Rust standard library for Darwin target
        if: needs.select-tier.outputs.full == 'true'
        run: soldr rustup target add "${{ matrix.target }}" --toolchain 1.95.0

      - name: Install uv
        if: needs.select-tier.outputs.full == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build Darwin wheel on Linux
        if: needs.select-tier.outputs.full == 'true'
        env:
          BOSN_WHEEL_TARGET: ${{ matrix.target }}
          PYO3_CROSS_PYTHON_VERSION: "3.10"
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
        run: uv build --wheel --out-dir dist

      - name: Verify Darwin wheel statically on Linux
        if: needs.select-tier.outputs.full == 'true'
        run: >-
          python ci/verify_cross_wheel.py "dist/bosn-*.whl"
          --target "${{ matrix.target }}"

      - name: Upload Darwin wheel
        if: needs.select-tier.outputs.full == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bosn-wheel-${{ matrix.target }}
          path: dist/bosn-*.whl
          if-no-files-found: error

  darwin-hosted-smoke:
    name: Hosted macOS wheel smoke (${{ matrix.target }})
    if: needs.select-tier.outputs.full == 'true'
    needs: [select-tier, darwin-cross-wheel]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: bosn-wheel-${{ matrix.target }}
          path: dist
      - name: Install and smoke-test Linux-built Darwin wheel
        run: python ci/verify_installed_wheel.py --installer pip "dist/bosn-*.whl"

  # The desktop widget links WebKitGTK, which the core workspace never does
  # (ci/lint_no_webview_in_core.py). A change under crates/bosn-widget/ selects
  # it by path (select-tier's `widget`); `ci-widget` forces it. Required check.
  widget:
    name: Desktop widget (Linux, WebKitGTK)
    if: ${{ !cancelled() && (needs.select-tier.outputs.widget == 'true' || contains(github.event.pull_request.labels.*.name, 'ci-widget')) }}
    needs: [select-tier]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.event.pull_request.head.sha || github.sha }}

      - name: Set up Soldr
        uses: zackees/setup-soldr@fe965fc7e2c5203570072e1d0fd19d0935d98e39
        with:
          version: "0.9.27"
          toolchain: "1.95.0"
          prebuild-deps: none
          # clippy is installed on demand after setup; a restored solo
          # toolchain snapshot lacks it ("cargo-clippy is not applicable").
          solo-toolchain-cache: "false"

      - name: Install WebKitGTK development packages
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev pkg-config libssl-dev

      - name: Lint and test bosn-widget
        run: |
          soldr cargo fmt --check --manifest-path crates/bosn-widget/Cargo.toml
          soldr cargo clippy --manifest-path crates/bosn-widget/Cargo.toml --locked --all-targets -- -D warnings
          soldr cargo test --manifest-path crates/bosn-widget/Cargo.toml --locked

      - name: Build and verify source-bound Linux desktop archive
        env:
          BOSN_WIDGET_SOURCE_SHA: ${{ inputs.commit_sha || github.event.pull_request.head.sha || github.sha }}
        run: |
          soldr cargo build --release --manifest-path crates/bosn-widget/Cargo.toml --locked
          version="$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          python ci/widget_artifact.py stage crates/bosn-widget/target/release/bosn-widget --version "$version" --source-sha "$BOSN_WIDGET_SOURCE_SHA"

      - name: Retain exact-candidate desktop release artifact
        uses: actions/upload-artifact@v4
        with:
          name: bosn-widget-linux-${{ inputs.commit_sha || github.event.pull_request.head.sha || github.sha }}
          path: widget-dist/*
          if-no-files-found: error

  full-coverage:
    name: Full CI coverage (exact candidate SHA)
    if: ${{ !cancelled() && needs.select-tier.outputs.full == 'true' }}
    needs: [select-tier, lint-no-macos-runners, rust, linux, native-wheel, darwin-cross-wheel, darwin-hosted-smoke, widget]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    # GATE-012: only GitHub can run this job. A local `bosn ci run` reports it
    # remote_only with this reason; there, the run's own verdict covers it.
    env:
      CI_REMOTE_ONLY: verifies this run's jobs through the GitHub Actions API, which has no record of a local run
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.event.pull_request.head.sha || github.sha }}
      - name: Verify all full-tier platform cells
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.commit_sha || github.event.pull_request.head.sha || github.sha }}
        run: >-
          python3 ci/verify_full_coverage.py --run-id "${{ github.run_id }}"
          --candidate-sha "$CANDIDATE_SHA"

  # Queue visibility (issue #257). The hosted runner pool is shared account-wide,
  # so a run can wait behind other repositories' work for longer than it takes
  # to execute. This job reports every lane's queue and execution time to the
  # step summary and warns, naming the delayed jobs and the escalation owner,
  # when the docs/ci-queue-slo.md SLO is breached. It never fails the run:
  # capacity is an account-level condition, not a Bosn defect.
  ci-queue-timing:
    name: CI queue timing
    if: ${{ !cancelled() }}
    needs: [select-tier, lint-no-macos-runners, rust, linux, native-wheel, darwin-cross-wheel, darwin-hosted-smoke, widget, full-coverage]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    # GATE-012: only GitHub can run this job (see full-coverage).
    env:
      CI_REMOTE_ONLY: reads this run's queue timing from the GitHub Actions API, which has no record of a local run
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.event.pull_request.head.sha || github.sha }}
      - name: Report queue and execution timing against the SLO
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 ci/ci_queue_timing.py report --run-id "${{ github.run_id }}"
          --summary-file "$GITHUB_STEP_SUMMARY"
