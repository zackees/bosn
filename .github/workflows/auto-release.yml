name: Release

# The pretag release gate (AGENTS.md "Releasing"; zackees/soldr#3343/#3345).
# A release is requested only by dispatching this workflow with an exact
# candidate SHA on main and the ID of a successful full CI run of that SHA:
#
#   gh workflow run ci.yml -f tier=full -f commit_sha=<SHA>        # proof
#   gh workflow run auto-release.yml -f candidate_sha=<SHA> \
#     -f full_ci_run_id=<ID> [-f issue=<N>] -f dry_run=false        # release
#
# The guard (ci/release_gate.py) refuses unless that CI run is an explicit
# full-tier dispatch of ci.yml from main named `CI full <SHA>`, completed
# green with every full-tier cell, and the SHA is reachable from main. Every
# build and publishing job needs the guard, so the tag `v<version>` (created
# by `gh release create --target <SHA>` in the last job) and every upload
# happen only after it. An optional release-request issue must name the same
# `candidate_sha:` and `tag:`; the release reports back to it.
#
# There is no push trigger: a version bump reaching main, or a pushed tag,
# releases nothing. A failed attempt is retried by dispatching the same SHA
# again, never by bumping the version. dry_run (the default) builds and
# verifies every wheel and publishes nothing.
#
# The four wheel builds copy ci.yml's wheel lanes step for step, so a release
# ships exactly what the required checks verified. They are copies, not a
# shared `workflow_call`, because branch protection requires ci.yml's job names
# verbatim and a reusable workflow would rename them.
#
# Publishing needs `vars.PUBLISH_PYPI == 'true'` and this workflow registered on
# pypi.org as the trusted publisher for `bosn`: repository zackees/bosn,
# workflow `auto-release.yml`, environment `pypi`. PyPI matches both names
# exactly, so renaming this file or the environment breaks publishing. No PyPI
# token is stored. Every publishing step is idempotent: a re-run verifies what
# is already published and uploads only what is missing.

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact commit on main to release (full 40-character SHA)
        required: true
        type: string
      full_ci_run_id:
        description: ID of a successful `CI full <candidate_sha>` dispatch run of ci.yml
        required: true
        type: string
      issue:
        description: Optional release-request issue naming candidate_sha and tag
        type: string
        default: ""
      dry_run:
        description: Build and verify everything, publish nothing
        type: boolean
        default: true

# One release attempt at a time; never cancel one that may be publishing.
concurrency:
  group: bosn-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard:
    name: Release guard
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: read
    outputs:
      release: ${{ steps.source.outputs.release }}
      tag: ${{ steps.source.outputs.tag }}
      sha: ${{ steps.source.outputs.sha }}
      dry_run: ${{ steps.source.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The pretag gate: the candidate is on main and full CI is green on it.
      - name: Require full CI green on the exact candidate SHA
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CI_RUN_ID: ${{ inputs.full_ci_run_id }}
          ISSUE: ${{ inputs.issue }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: >-
          python ci/release_gate.py resolve
          --candidate-sha "$CANDIDATE_SHA" --ci-run-id "$CI_RUN_ID"
          --issue "$ISSUE" --dry-run "$DRY_RUN"
          --output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"

      - name: Tag matches the release version, and nothing else declares one
        if: steps.source.outputs.release == 'true'
        run: python ci/verify_release.py source --tag "${{ steps.source.outputs.tag }}"

      - name: kernal-api comes from crates.io, exactly
        if: steps.source.outputs.release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python ci/verify_kernel_boundary.py
          for manifest in crates/*/Cargo.toml; do
            if grep -q kernal-api "$manifest"; then
              python ci/verify_release_dependencies.py "$manifest"
            fi
          done

  native-wheel:
    name: Native wheel (${{ matrix.os }})
    needs: guard
    if: needs.guard.outputs.release == 'true'
    env:
      RELEASE_TAG: ${{ needs.guard.outputs.tag }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.sha }}

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Soldr for the wheel backend
        uses: zackees/setup-soldr@fe965fc7e2c5203570072e1d0fd19d0935d98e39
        with:
          version: "0.9.32"
          toolchain: "1.95.0"
          prebuild-deps: none

      - name: Build platform wheel
        # The backend requires a provisioned Soldr front door on both hosts.
        run: uv build --wheel --out-dir dist

      - name: Install and smoke-test platform wheel outside the checkout
        run: python ci/verify_installed_wheel.py "dist/bosn-*.whl"

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: bosn-wheel-${{ matrix.os }}
          path: dist/bosn-*.whl
          if-no-files-found: error

  darwin-wheel:
    name: Darwin wheel (${{ matrix.target }}, Linux-hosted Soldr)
    needs: guard
    if: needs.guard.outputs.release == 'true'
    env:
      RELEASE_TAG: ${{ needs.guard.outputs.tag }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-apple-darwin
            deployment_target: "10.12"
          - target: aarch64-apple-darwin
            deployment_target: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.sha }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - name: Set up Soldr Darwin target
        uses: zackees/setup-soldr@v0 # v0.9.82 or later (floating major)
        with:
          cache: false
          cross-targets: ${{ matrix.target }}

      - name: Export Soldr target environment
        run: soldr prepare --target "${{ matrix.target }}" --github-env "$GITHUB_ENV"

      - name: Install Rust standard library for Darwin target
        run: soldr rustup target add "${{ matrix.target }}" --toolchain 1.95.0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build Darwin wheel on Linux
        env:
          BOSN_WHEEL_TARGET: ${{ matrix.target }}
          PYO3_CROSS_PYTHON_VERSION: "3.10"
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
        run: uv build --wheel --out-dir dist

      - name: Verify Darwin wheel statically on Linux
        run: >-
          python ci/verify_cross_wheel.py "dist/bosn-*.whl"
          --target "${{ matrix.target }}"

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: bosn-wheel-${{ matrix.target }}
          path: dist/bosn-*.whl
          if-no-files-found: error

  darwin-hosted-smoke:
    name: Hosted macOS release wheel smoke (${{ matrix.target }})
    needs: [guard, darwin-wheel]
    if: needs.guard.outputs.release == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: bosn-wheel-${{ matrix.target }}
          path: dist
      - name: Install and smoke-test release wheel
        run: python ci/verify_installed_wheel.py --installer pip "dist/bosn-*.whl"

  collect:
    name: Collect and verify the release set
    permissions:
      actions: read
      contents: read
    needs: [guard, native-wheel, darwin-wheel, darwin-hosted-smoke]
    if: needs.guard.outputs.release == 'true'
    env:
      RELEASE_TAG: ${{ needs.guard.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.sha }}

      - uses: actions/download-artifact@v4
        with:
          pattern: bosn-wheel-*
          path: dist
          merge-multiple: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Exactly the four platform wheels, at the tagged version
        run: python ci/verify_release.py wheels --tag "$RELEASE_TAG" dist

      - name: Download the desktop archive from the exact full CI run
        uses: actions/download-artifact@v4
        with:
          name: bosn-widget-linux-${{ needs.guard.outputs.sha }}
          run-id: ${{ inputs.full_ci_run_id }}
          github-token: ${{ github.token }}
          path: widget-dist

      - name: Verify desktop archive source, version and checksums
        env:
          RELEASE_SHA: ${{ needs.guard.outputs.sha }}
        run: |
          python ci/widget_artifact.py verify "widget-dist/bosn-widget-${RELEASE_TAG}-x86_64-unknown-linux-gnu.tar.gz" --version "${RELEASE_TAG#v}" --source-sha "$RELEASE_SHA"

      - name: Package metadata renders on PyPI
        run: uv run --no-project --with twine twine check --strict dist/*

      - name: Record the release set
        shell: bash
        run: |
          {
            echo "### $RELEASE_TAG wheels"
            echo '```'
            (cd dist && sha256sum -- *.whl)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: bosn-release-${{ env.RELEASE_TAG }}
          path: dist/*.whl
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: bosn-desktop-${{ env.RELEASE_TAG }}
          path: widget-dist/*
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: [guard, collect]
    if: ${{ needs.guard.outputs.release == 'true' && needs.guard.outputs.dry_run == 'false' && vars.PUBLISH_PYPI == 'true' }}
    env:
      RELEASE_TAG: ${{ needs.guard.outputs.tag }}
    runs-on: ubuntu-latest
    # Must equal the environment on the PyPI trusted-publisher entry.
    environment: pypi
    permissions:
      # PyPI trusted publishing: the OIDC token is exchanged for a short-lived
      # upload token, so no PyPI credential is stored in this repository.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bosn-release-${{ env.RELEASE_TAG }}
          path: dist

      # PyPI never lets a filename be replaced. A re-run, or a recovery after a
      # partial upload, must prove that every file PyPI already holds is
      # byte-identical to this build; only the missing ones are then uploaded.
      - name: Refuse if PyPI already holds different bytes
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          status="$(curl -sS -o pypi.json -w '%{http_code}' \
            "https://pypi.org/pypi/bosn/${version}/json")"
          if [[ "$status" == "404" ]]; then
            echo "bosn ${version} is not on PyPI yet"
            exit 0
          fi
          [[ "$status" == "200" ]] || { echo "::error::PyPI returned HTTP $status" >&2; exit 1; }
          for wheel in dist/*.whl; do
            name="$(basename "$wheel")"
            published="$(jq -r --arg name "$name" \
              '.urls[] | select(.filename == $name) | .digests.sha256' pypi.json)"
            if [[ -z "$published" ]]; then
              echo "$name: not on PyPI yet"
            elif [[ "$published" == "$(sha256sum "$wheel" | awk '{print $1}')" ]]; then
              echo "$name: already on PyPI, identical"
            else
              echo "::error::$name differs from the copy already on PyPI" >&2
              exit 1
            fi
          done

      - name: Publish the wheels PyPI does not have yet
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          skip-existing: true

  github-release:
    name: GitHub release
    needs: [guard, collect, publish-pypi]
    # After PyPI succeeds, or when PyPI publishing is switched off; never after
    # a failed upload, so a GitHub release never advertises a version PyPI lacks.
    if: >-
      ${{ always()
      && needs.guard.outputs.release == 'true'
      && needs.collect.result == 'success'
      && needs.guard.outputs.dry_run == 'false'
      && (needs.publish-pypi.result == 'success' || needs.publish-pypi.result == 'skipped') }}
    env:
      RELEASE_TAG: ${{ needs.guard.outputs.tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bosn-release-${{ env.RELEASE_TAG }}
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: bosn-desktop-${{ env.RELEASE_TAG }}
          path: widget-dist

      # The tag is created here, by `--target`, after the guard's full-CI check.
      - name: Create, or verify the existing release's assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.guard.outputs.sha }}
          PYPI_RESULT: ${{ needs.publish-pypi.result }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            existing="$(mktemp -d)"
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$existing"
            for asset in dist/*.whl widget-dist/*; do
              cmp "$asset" "$existing/$(basename "$asset")"
            done
          else
            gh release create "$RELEASE_TAG" dist/*.whl widget-dist/* \
              --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" --generate-notes
          fi
          if [[ "$PYPI_RESULT" == "skipped" ]]; then
            echo "PyPI: not published (vars.PUBLISH_PYPI is not 'true')." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Report to the release-request issue
        if: inputs.issue != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
          RELEASE_SHA: ${{ needs.guard.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          url="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url -q .url)"
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" \
            --body "Released [$RELEASE_TAG]($url) from \`$RELEASE_SHA\` by $RUN_URL after full CI passed on that SHA."
          gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY" --reason completed
