name: Release

# Merging a version bump to main releases it, the way zackees/zccache and
# zackees/soldr do: `./bump patch` changes `[workspace.package].version` in
# Cargo.toml (the only place it is written), and when that change lands on main
# this workflow builds, verifies, and publishes `v<version>`, creating the tag.
# A push to main that does not change the version does nothing.
#
# Two manual routes remain. Pushing a tag `vX.Y.Z` on main releases that tag.
# `workflow_dispatch` runs a tag, dry by default: it builds and verifies every
# wheel and publishes nothing, and a dry run of a tag that does not exist yet
# rehearses main. A dispatch with dry_run=false publishes an existing tag, e.g.
# to recover a failed run.
#
# The four wheel builds copy ci.yml's wheel lanes step for step, so a release
# ships exactly what the required checks verified. They are copies, not a
# shared `workflow_call`, because branch protection requires ci.yml's job names
# verbatim and a reusable workflow would rename them.
#
# Publishing needs `vars.PUBLISH_PYPI == 'true'` and this workflow registered on
# pypi.org as the trusted publisher for `bosn`: repository zackees/bosn,
# workflow `auto-release.yml`, environment `pypi`. PyPI matches both names
# exactly, so renaming this file or the environment breaks publishing. No PyPI
# token is stored. Every publishing step is idempotent: a re-run verifies what
# is already published and uploads only what is missing.

on:
  push:
    branches: [main]
    # Only a manifest change can change the version.
    paths: [Cargo.toml]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release, e.g. v0.1.4 (a dry run may name one not pushed yet)
        required: true
        type: string
      dry_run:
        description: Build and verify everything, publish nothing
        type: boolean
        default: true

concurrency:
  group: bosn-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard:
    name: Release guard
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.source.outputs.release }}
      tag: ${{ steps.source.outputs.tag }}
      sha: ${{ steps.source.outputs.sha }}
      dry_run: ${{ steps.source.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Decides whether this run releases, which tag, and the one commit it builds.
      - name: Resolve the release, and require it on main
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          BEFORE: ${{ github.event.before }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          workspace_version() {  # [workspace.package].version at a revision, or nothing
            git show "$1:Cargo.toml" 2>/dev/null | python3 -c \
              'import sys, tomllib; print(tomllib.loads(sys.stdin.read())["workspace"]["package"]["version"])' \
              2>/dev/null || true
          }
          skip() {
            echo "$1"
            { echo "release=false"; echo "tag="; echo "sha="; echo "dry_run=true"; } >> "$GITHUB_OUTPUT"
            echo "No release: $1" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }

          dry_run=false
          sha=""
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
            [[ "$INPUT_DRY_RUN" == "true" ]] && dry_run=true
          elif [[ "$REF_TYPE" == "tag" ]]; then
            tag="$REF_NAME"
          else
            # A push to main: release only if it changed the version.
            new="$(workspace_version HEAD)"
            old=""
            [[ "$BEFORE" =~ ^0+$ ]] || old="$(workspace_version "$BEFORE")"
            [[ -n "$new" ]] || { echo "::error::Cargo.toml has no [workspace.package] version" >&2; exit 1; }
            [[ -n "$old" && "$new" != "$old" ]] || skip "the version did not change (${old:-none} -> $new)"
            tag="v$new"
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 \
              && skip "$tag is already released"
            git rev-parse -q --verify "refs/tags/$tag" > /dev/null \
              && skip "tag $tag already exists; its own run releases it"
            sha="$(git rev-parse HEAD)"
            source="version bump $old -> $new on main"
          fi

          if [[ -z "$sha" ]]; then
            if sha="$(git rev-parse -q --verify "refs/tags/${tag}^{commit}")"; then
              source="tag $tag"
            elif [[ "$dry_run" == "true" ]]; then
              sha="$(git rev-parse origin/main)"
              source="main (tag $tag does not exist yet)"
            else
              echo "::error::tag $tag does not exist" >&2
              exit 1
            fi
          fi
          git merge-base --is-ancestor "$sha" origin/main \
            || { echo "::error::$tag ($sha) is not on main" >&2; exit 1; }
          git checkout -q "$sha"
          { echo "release=true"; echo "tag=$tag"; echo "sha=$sha"; echo "dry_run=$dry_run"; } >> "$GITHUB_OUTPUT"
          echo "Releasing $tag from $source at $sha (dry run: $dry_run)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@v5
        if: steps.source.outputs.release == 'true'
        with:
          python-version: "3.11"

      - name: Tag matches the release version, and nothing else declares one
        if: steps.source.outputs.release == 'true'
        run: python ci/verify_release.py source --tag "${{ steps.source.outputs.tag }}"

      - name: kernal-api comes from crates.io, exactly
        if: steps.source.outputs.release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python ci/verify_kernel_boundary.py
          for manifest in crates/*/Cargo.toml; do
            if grep -q kernal-api "$manifest"; then
              python ci/verify_release_dependencies.py "$manifest"
            fi
          done

  native-wheel:
    name: Native wheel (${{ matrix.os }})
    needs: guard
    if: needs.guard.outputs.release == 'true'
    env:
      RELEASE_TAG: ${{ needs.guard.outputs.tag }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.sha }}

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build platform wheel
        run: uv build --wheel --out-dir dist

      - name: Install and smoke-test platform wheel outside the checkout
        run: python ci/verify_installed_wheel.py "dist/bosn-*.whl"

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: bosn-wheel-${{ matrix.os }}
          path: dist/bosn-*.whl
          if-no-files-found: error

  darwin-wheel:
    name: Darwin wheel (${{ matrix.target }}, Linux-hosted Soldr)
    needs: guard
    if: needs.guard.outputs.release == 'true'
    env:
      RELEASE_TAG: ${{ needs.guard.outputs.tag }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-apple-darwin
            deployment_target: "10.12"
          - target: aarch64-apple-darwin
            deployment_target: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.sha }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - name: Set up Soldr Darwin target
        uses: zackees/setup-soldr@bb28e96d2dc32c058242f56722297caf1efcbd90
        with:
          cache: false
          cross-targets: ${{ matrix.target }}

      - name: Export Soldr target environment
        run: soldr prepare --target "${{ matrix.target }}" --github-env "$GITHUB_ENV"

      - name: Install Rust standard library for Darwin target
        run: rustup target add "${{ matrix.target }}" --toolchain 1.95.0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build Darwin wheel on Linux
        env:
          BOSN_WHEEL_TARGET: ${{ matrix.target }}
          PYO3_CROSS_PYTHON_VERSION: "3.10"
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
        run: uv build --wheel --out-dir dist

      - name: Verify Darwin wheel statically on Linux
        run: >-
          python ci/verify_cross_wheel.py "dist/bosn-*.whl"
          --target "${{ matrix.target }}"

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: bosn-wheel-${{ matrix.target }}
          path: dist/bosn-*.whl
          if-no-files-found: error

  collect:
    name: Collect and verify the release set
    needs: [guard, native-wheel, darwin-wheel]
    if: needs.guard.outputs.release == 'true'
    env:
      RELEASE_TAG: ${{ needs.guard.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.sha }}

      - uses: actions/download-artifact@v4
        with:
          pattern: bosn-wheel-*
          path: dist
          merge-multiple: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Exactly the four platform wheels, at the tagged version
        run: python ci/verify_release.py wheels --tag "$RELEASE_TAG" dist

      - name: Package metadata renders on PyPI
        run: uv run --no-project --with twine twine check --strict dist/*

      - name: Record the release set
        shell: bash
        run: |
          {
            echo "### $RELEASE_TAG wheels"
            echo '```'
            (cd dist && sha256sum -- *.whl)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: bosn-release-${{ env.RELEASE_TAG }}
          path: dist/*.whl
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: [guard, collect]
    if: ${{ needs.guard.outputs.release == 'true' && needs.guard.outputs.dry_run == 'false' && vars.PUBLISH_PYPI == 'true' }}
    env:
      RELEASE_TAG: ${{ needs.guard.outputs.tag }}
    runs-on: ubuntu-latest
    # Must equal the environment on the PyPI trusted-publisher entry.
    environment: pypi
    permissions:
      # PyPI trusted publishing: the OIDC token is exchanged for a short-lived
      # upload token, so no PyPI credential is stored in this repository.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bosn-release-${{ env.RELEASE_TAG }}
          path: dist

      # PyPI never lets a filename be replaced. A re-run, or a recovery after a
      # partial upload, must prove that every file PyPI already holds is
      # byte-identical to this build; only the missing ones are then uploaded.
      - name: Refuse if PyPI already holds different bytes
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          status="$(curl -sS -o pypi.json -w '%{http_code}' \
            "https://pypi.org/pypi/bosn/${version}/json")"
          if [[ "$status" == "404" ]]; then
            echo "bosn ${version} is not on PyPI yet"
            exit 0
          fi
          [[ "$status" == "200" ]] || { echo "::error::PyPI returned HTTP $status" >&2; exit 1; }
          for wheel in dist/*.whl; do
            name="$(basename "$wheel")"
            published="$(jq -r --arg name "$name" \
              '.urls[] | select(.filename == $name) | .digests.sha256' pypi.json)"
            if [[ -z "$published" ]]; then
              echo "$name: not on PyPI yet"
            elif [[ "$published" == "$(sha256sum "$wheel" | awk '{print $1}')" ]]; then
              echo "$name: already on PyPI, identical"
            else
              echo "::error::$name differs from the copy already on PyPI" >&2
              exit 1
            fi
          done

      - name: Publish the wheels PyPI does not have yet
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          skip-existing: true

  github-release:
    name: GitHub release
    needs: [guard, collect, publish-pypi]
    # After PyPI succeeds, or when PyPI publishing is switched off; never after
    # a failed upload, so a GitHub release never advertises a version PyPI lacks.
    if: >-
      ${{ always()
      && needs.guard.outputs.release == 'true'
      && needs.collect.result == 'success'
      && needs.guard.outputs.dry_run == 'false'
      && (needs.publish-pypi.result == 'success' || needs.publish-pypi.result == 'skipped') }}
    env:
      RELEASE_TAG: ${{ needs.guard.outputs.tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bosn-release-${{ env.RELEASE_TAG }}
          path: dist

      - name: Create, or verify the existing release's assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.guard.outputs.sha }}
          PYPI_RESULT: ${{ needs.publish-pypi.result }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            existing="$(mktemp -d)"
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$existing"
            for wheel in dist/*.whl; do
              cmp "$wheel" "$existing/$(basename "$wheel")"
            done
          else
            gh release create "$RELEASE_TAG" dist/*.whl \
              --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" --generate-notes
          fi
          if [[ "$PYPI_RESULT" == "skipped" ]]; then
            echo "PyPI: not published (vars.PUBLISH_PYPI is not 'true')." >> "$GITHUB_STEP_SUMMARY"
          fi
