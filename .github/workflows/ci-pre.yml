# CI Pre: called by ci.yml; nothing waits on it (local-gate.toml
# verify-exempt). zackees/ci.yml#198 (GATE-010), bosn#361 phase 2.
#
# Publishes each stamp-valid `Ci-Attestation:` of this commit as its own tiny
# cache entry,
#   att1-<gate>-m<b>-c<k>-<sha10>${{ env.PR_CACHE_TAG }}
# a human-readable, ancestor-defining lineage label. Later runs list them
# (GET-only REST) with `ci-lint attest resolve --require-gate` to choose which
# caches are valid to hydrate. It checks out the PR head with full history
# (lineage ordinals and the trailers live there) but only READS it: the code
# it runs is ci_lint from the pinned ci.yml ref, never a PR-authored script.
# Cache saves use the runner's token, which GitHub scopes to this ref.

name: CI Pre

on:
  workflow_call:

permissions:
  contents: read

env:
  # Every PR-reachable cache save carries this tag; empty outside a PR.
  PR_CACHE_TAG: ${{ github.event_name == 'pull_request' && format('-pr-{0}', github.event.pull_request.number) || '' }}

jobs:
  attestations:
    name: Publish ci-attestations
    if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zackees/ci.yml
          ref: c87f1a2b88c07037d5c10a8e8ff27dd25895eab9
          path: .ci-lint
          persist-credentials: false
          sparse-checkout: ci_lint
      - name: Validate attestations and derive side-entry keys
        id: att
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          args=(--repo . --commit "$HEAD_SHA" --main-ref origin/main --out-dir "$RUNNER_TEMP/ci-attestations" --github-output)
          if [[ -n "$PR_NUMBER" ]]; then args+=(--pr "$PR_NUMBER" --base "$BASE_SHA"); fi
          PYTHONPATH=.ci-lint python3 -m ci_lint attest keys "${args[@]}"
      # One step per declared gate (ci-attestations.yml has 7).
      - name: Save attestation side entry 0
        if: ${{ fromJSON(steps.att.outputs.count || '0') > 0 }}
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.att.outputs.path_0 }}
          key: ${{ steps.att.outputs.stem_0 }}${{ env.PR_CACHE_TAG }}
      - name: Save attestation side entry 1
        if: ${{ fromJSON(steps.att.outputs.count || '0') > 1 }}
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.att.outputs.path_1 }}
          key: ${{ steps.att.outputs.stem_1 }}${{ env.PR_CACHE_TAG }}
      - name: Save attestation side entry 2
        if: ${{ fromJSON(steps.att.outputs.count || '0') > 2 }}
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.att.outputs.path_2 }}
          key: ${{ steps.att.outputs.stem_2 }}${{ env.PR_CACHE_TAG }}
      - name: Save attestation side entry 3
        if: ${{ fromJSON(steps.att.outputs.count || '0') > 3 }}
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.att.outputs.path_3 }}
          key: ${{ steps.att.outputs.stem_3 }}${{ env.PR_CACHE_TAG }}
      - name: Save attestation side entry 4
        if: ${{ fromJSON(steps.att.outputs.count || '0') > 4 }}
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.att.outputs.path_4 }}
          key: ${{ steps.att.outputs.stem_4 }}${{ env.PR_CACHE_TAG }}
      - name: Save attestation side entry 5
        if: ${{ fromJSON(steps.att.outputs.count || '0') > 5 }}
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.att.outputs.path_5 }}
          key: ${{ steps.att.outputs.stem_5 }}${{ env.PR_CACHE_TAG }}
      - name: Save attestation side entry 6
        if: ${{ fromJSON(steps.att.outputs.count || '0') > 6 }}
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.att.outputs.path_6 }}
          key: ${{ steps.att.outputs.stem_6 }}${{ env.PR_CACHE_TAG }}
