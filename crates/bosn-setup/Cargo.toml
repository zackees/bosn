[package]
name = "bosn-setup"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
# Internal: amalgamated into the crates.io `bosn` crate at release.
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
bosn-core = { path = "../bosn-core" }
bosn-engine = { path = "../bosn-engine" }
kernal-api = { version = "=0.1.14", default-features = false, features = ["fs", "hash-sha256", "http-client", "ipc"] }

[features]
native-test-helper = ["bosn-engine/native-test-helper"]

[dev-dependencies]
tempfile = "=3.27.0"
