[package]
name = "bosn-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
# Internal: amalgamated into the crates.io `bosn` crate at release.
publish = false
# One integration-test binary (tests/integration.rs) instead of one per file:
# each would relink the whole crate graph after every edit (bosn#503).
autotests = false

[[bin]]
name = "bosn-rs"
path = "src/bin/bosn-rs.rs"

[[bin]]
name = "bosn"
path = "src/bin/bosn.rs"

[dependencies]
bosn-core = { path = "../bosn-core" }
bosn-registry = { path = "../bosn-registry" }
bosn-setup = { path = "../bosn-setup" }
bosn-engine = { path = "../bosn-engine" }
bosn-generation = { path = "../bosn-generation" }
prost = "=0.14.4"
kernal-api = { version = "=0.1.28", default-features = false, features = ["sqlite", "fs", "ipc", "ipc-async", "secure-random", "daemon-frame-v1", "hash-sha256", "http-client", "http-server", "event-stream", "archive"] }
toml = "=0.8.23"
toml_edit = "=0.22.27"
serde_yaml = "=0.9.34"
schemars = "=1.2.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.149"
base64 = "=0.22.1"
futures-util = "=0.3.34"
time = { version = "=0.3.55", features = ["formatting", "parsing"] }

[dev-dependencies]
native-tls = "=0.2.18"
tempfile = "=3.27.0"
# The synthetic engine lets the removal path be exercised without a real Docker.
bosn-engine = { path = "../bosn-engine", features = ["native-test-helper"] }

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"
