[package]
name = "bosn-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[[bin]]
name = "bosn-rs"
path = "src/bin/bosn-rs.rs"

[dependencies]
bosn-registry = { path = "../bosn-registry" }
prost = "=0.14.4"
kernal-api = { git = "https://github.com/zackees/kernal-api", rev = "fc634e507024d63ccaaf75fa564818b9dcfbff36", version = "=0.1.0", default-features = false, features = ["sqlite", "fs", "ipc", "ipc-async", "secure-random", "daemon-frame-v1"] }
