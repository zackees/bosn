[package]
name = "bosn-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[[bin]]
name = "bosn-rs"
path = "src/bin/bosn-rs.rs"

[[bin]]
name = "bosn"
path = "src/bin/bosn.rs"

[dependencies]
bosn-core = { path = "../bosn-core" }
bosn-registry = { path = "../bosn-registry" }
bosn-setup = { path = "../bosn-setup" }
bosn-engine = { path = "../bosn-engine" }
bosn-generation = { path = "../bosn-generation" }
prost = "=0.14.4"
kernal-api = { git = "https://github.com/zackees/kernal-api", rev = "fc634e507024d63ccaaf75fa564818b9dcfbff36", version = "=0.1.0", default-features = false, features = ["sqlite", "fs", "ipc", "ipc-async", "secure-random", "daemon-frame-v1"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.149"

[dev-dependencies]
native-tls = "=0.2.18"
tempfile = "=3.27.0"
