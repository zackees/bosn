name: unnamed
on: [push]
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - run: echo one
      - name: Named
        run: echo two
      - if: false
        run: echo never
      - run: |
          printf 'fatal: no newline' >&2
          exit 3
