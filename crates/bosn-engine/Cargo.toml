[package]
name = "bosn-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
# Internal: amalgamated into the crates.io `bosn` crate at release.
publish = false

[dependencies]
kernal-api = { version = "=0.1.14", default-features = false }
libc = { version = "=0.2.189", optional = true }

[features]
native-test-helper = ["dep:libc"]

[[bin]]
name = "bosn-engine-native-helper"
path = "src/bin/bosn-engine-native-helper.rs"
required-features = ["native-test-helper"]
