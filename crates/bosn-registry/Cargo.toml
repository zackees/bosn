[package]
name = "bosn-registry"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[features]
# Test harness only; excludes the cross-language lock helper from normal builds.
migration-test-helper = []

[[bin]]
name = "migration-guard-test"
path = "src/bin/migration-guard-test.rs"
required-features = ["migration-test-helper"]

[dependencies]
bosn-core = { path = "../bosn-core" }
serde_json = "=1.0.149"
# DEVELOPMENT ONLY: kernal-api 0.1.0 has not been published.  The release
# verifier rejects this source before a Bosn release is made.
kernal-api = { git = "https://github.com/zackees/kernal-api", rev = "10e558a9f2eb51c2989c89d05b13cf7636bd374e", version = "=0.1.0", default-features = false, features = ["sqlite", "fs", "secure-random"] }

[dev-dependencies]
