[package]
name = "bosn-registry"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
# Internal: amalgamated into the crates.io `bosn` crate at release.
publish = false

[features]
# Test harness only; excludes the cross-language lock helper from normal builds.
migration-test-helper = []

[[bin]]
name = "migration-guard-test"
path = "src/bin/migration-guard-test.rs"
required-features = ["migration-test-helper"]

[[bin]]
name = "migration-import-test"
path = "src/bin/migration-import-test.rs"
required-features = ["migration-test-helper"]

[dependencies]
bosn-core = { path = "../bosn-core" }
serde = { version = "=1.0.229", features = ["derive"] }
# Immutable Act ownership labels include the exact persisted f64 timestamp.
# Approximate JSON parsing can otherwise change that value by one ULP.
serde_json = { version = "=1.0.149", features = ["float_roundtrip"] }
kernal-api = { version = "=0.1.14", default-features = false, features = ["sqlite", "fs", "ipc", "secure-random", "hash-sha256"] }

[dev-dependencies]
