[package]
name = "bosn-generation"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
bosn-core = { path = "../bosn-core" }
bosn-engine = { path = "../bosn-engine" }
kernal-api = { git = "https://github.com/zackees/kernal-api", rev = "fc634e507024d63ccaaf75fa564818b9dcfbff36", version = "=0.1.0", default-features = false, features = ["hash-sha256", "fs"] }
serde_json = "=1.0.149"

[features]
native-test-helper = ["bosn-engine/native-test-helper"]

[dev-dependencies]
bosn-engine = { path = "../bosn-engine", features = ["native-test-helper"] }
tempfile = "=3.27.0"

[[bin]]
name = "bosn-generation-resolver-helper"
path = "src/bin/bosn-generation-resolver-helper.rs"
required-features = ["native-test-helper"]
