[package]
# The PyO3 extension behind `import bosn`. It ships in the PyPI wheel, never on
# crates.io: the crates.io `bosn` is crates/bosn, amalgamated at release.
name = "bosn-python"
version.workspace = true
edition = "2024"
rust-version = "1.95"
publish = false

[lib]
name = "bosn_native"
crate-type = ["cdylib"]

# The PEP 517 backend compiles this target, then Maturin installs it inside the
# wheel's platform library. Reuse the product CLI source rather than
# maintaining a second daemon implementation for Python users.
[[bin]]
name = "bosn-native"
path = "../bosn-service/src/bin/bosn.rs"
# The same source's unit tests run as bosn-service's `bosn` bin; testing it a
# second time here would only relink the CLI in the workspace test build.
test = false

[features]
# One stable CPython ABI floor across Linux, Windows, and both Darwin wheels.
# Do not remove this to make a host-specific cp311 wheel: #252's Linux-hosted
# cross release contract is explicitly abi3-py310.
default = ["pyo3/abi3-py310"]
# The wheel build selects `wheel` ([tool.maturin] features and the backend's CLI
# build). It is not a default, so the workspace test build links CPython and
# system OpenSSL and tests this crate in the same nextest run as the rest
# (bosn#503); vendored OpenSSL would serialise a ~40 s C build ahead of it.
wheel = ["extension-module", "dep:openssl-sys"]
# An extension module leaves CPython symbols for the host interpreter.
extension-module = ["pyo3/extension-module"]
# Test-only: link CPython and initialize it for the fake-daemon boundary test.
# Run with `--features bosn-python/embedded-python-tests` (see ci.yml).
embedded-python-tests = ["pyo3/auto-initialize"]

[dependencies]
bosn-core = { path = "../bosn-core" }
bosn-engine = { path = "../bosn-engine" }
bosn-service = { path = "../bosn-service" }
bosn-registry = { path = "../bosn-registry" }
bosn-setup = { path = "../bosn-setup" }
kernal-api = { version = "=0.1.28", default-features = false, features = ["ipc-async"] }
pyo3 = "=0.29.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.149"

# One OpenSSL for the whole Linux wheel (#265): kernal-api's http-client pulls
# reqwest default-tls, which is OpenSSL on Linux. Vendoring links it statically
# into both the extension and the `bosn` CLI, so the wheel ships no libssl or
# libcrypto (no auditwheel `bosn.libs/` copy, no `.data/scripts/` sidecars, no
# `$ORIGIN` rpath). Not a direct API dependency: it only selects the feature.
# macOS (Security.framework) and Windows (SChannel) never build OpenSSL.
# Only the `wheel` feature selects it.
[target.'cfg(target_os = "linux")'.dependencies]
openssl-sys = { version = "=0.9.117", features = ["vendored"], optional = true }

[build-dependencies]
# Only for the embedded-python-tests rpath (see build.rs); same pin as pyo3's own.
pyo3-build-config = { version = "=0.29.2", features = ["resolve-config"] }

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true
