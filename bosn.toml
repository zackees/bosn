[stack.test]
dockerfile = "docker/test.Dockerfile"
family = "python"
default = true

[stack.test.mounts]
repo = { source = ".", destination = "/repo", readonly = true }

[stack.test.volumes]
venv = { scope = "stack", destination = "/venv" }
uv-cache = { scope = "machine", destination = "/root/.cache/uv" }
ruff-cache = { scope = "machine", destination = "/root/.cache/ruff" }
pyright-cache = { scope = "machine", destination = "/root/.cache/pyright-python" }
cargo-home = { scope = "machine", destination = "/root/.cargo" }
rustup-home = { scope = "machine", destination = "/root/.rustup" }
rust-target = { scope = "stack", destination = "/repo/target" }
soldr-state = { scope = "stack", destination = "/root/.soldr" }

[task.test]
stack = "test"
cmd = "soldr toolchain ensure --json && uv sync --frozen --all-groups --no-editable && uv run --no-sync pytest -q -m 'not docker' -p no:cacheprovider"

# The Rust suite, isolated like the Python one (zackees/ci.yml GATE-005).
[task.rust-test]
stack = "test"
cmd = "soldr toolchain ensure --json && soldr cargo test --workspace --exclude bosn-python --locked && PYO3_PYTHON=$(command -v python3) soldr cargo test -p bosn-python --lib --locked --no-default-features --features embedded-python-tests"

[task.lint]
stack = "test"
cmd = "soldr toolchain ensure --json && uv sync --frozen --all-groups --no-editable && uv run --no-sync python ci/lint.py"

# A focused compile for edits to the local CI engine; preserves the same
# isolated, persistent Rust build state as rust-test without running suites.
[task.ci-engine-check]
stack = "test"
cmd = "soldr toolchain ensure --json && soldr cargo check -p bosn-service --locked"

[task.ci-engine-test]
stack = "test"
cmd = "soldr toolchain ensure --json && soldr cargo test -p bosn-service --lib ci::engine --locked && soldr cargo test -p bosn-service --lib ci::pins --locked && uv run --no-project --with pytest pytest tests/test_runner_tools.py"
