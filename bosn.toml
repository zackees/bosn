[stack.test]
dockerfile = "docker/test.Dockerfile"
family = "python"
default = true

[stack.test.mounts]
repo = { source = ".", destination = "/repo", readonly = true }

[stack.test.volumes]
venv = { scope = "stack", destination = "/venv" }
uv-cache = { scope = "machine", destination = "/root/.cache/uv" }
ruff-cache = { scope = "machine", destination = "/root/.cache/ruff" }
pyright-cache = { scope = "machine", destination = "/root/.cache/pyright-python" }
cargo-home = { scope = "machine", destination = "/root/.cargo" }
rustup-home = { scope = "machine", destination = "/root/.rustup" }
rust-target = { scope = "stack", destination = "/target" }
wheel-staging = { scope = "stack", destination = "/repo/.bosn-build" }
soldr-state = { scope = "stack", destination = "/root/.soldr" }

[task.test]
stack = "test"
cmd = "soldr toolchain ensure --json && uv sync --frozen --all-groups --no-editable && uv run --no-sync pytest -q -m 'not docker' -p no:cacheprovider"

# The Rust suite, isolated like the Python one (zackees/ci.yml GATE-005).
[task.rust-test]
stack = "test"
cmd = "soldr toolchain ensure --json && PYO3_PYTHON=$(command -v python3) soldr cargo test --workspace --locked --features bosn-python/embedded-python-tests"

[task.rust-lint]
stack = "test"
cmd = "soldr toolchain ensure --json && python ci/local_gate.py --lane rust"

[task.lint]
stack = "test"
cmd = "soldr toolchain ensure --json && uv sync --frozen --all-groups --no-editable && uv run --no-sync python ci/lint.py"

# A focused compile for edits to the local CI engine; preserves the same
# isolated, persistent Rust build state as rust-test without running suites.
[task.ci-engine-check]
stack = "test"
cmd = "soldr toolchain ensure --json && soldr cargo check -p bosn-service --locked"

[task.ci-engine-test]
stack = "test"
cmd = "soldr toolchain ensure --json && soldr cargo test -p bosn-service --lib ci::engine --locked && soldr cargo test -p bosn-service --lib ci::pins --locked && uv run --no-project --with pytest pytest tests/test_runner_tools.py"

# Focused isolated protocol-boundary tests; shares the existing Rust build state.
[task.ci-capabilities-test]
stack = "test"
cmd = "soldr toolchain ensure --json && soldr cargo fmt --all --check && soldr cargo clippy -p bosn-service --all-targets --locked -- -D warnings && soldr cargo test -p bosn-service --lib ci::engine::act_capabilities --locked"

# Frozen source history is a protocol boundary; reuse the isolated test stack.
[task.ci-snapshot-test]
stack = "test"
cmd = "soldr toolchain ensure --json && soldr cargo test -p bosn-service --lib ci::snapshot --locked"

# The Docker proxy's run scoping (#560, #547); reuses the isolated test stack.
[task.docker-proxy-test]
stack = "test"
cmd = "soldr toolchain ensure --json && soldr cargo test -p bosn-service --lib docker_proxy --locked"

# Managed retention and its daemon wire (#545); reuses the isolated test stack.
[task.retention-test]
stack = "test"
cmd = "soldr toolchain ensure --json && soldr cargo test -p bosn-core --lib retention --locked && soldr cargo test -p bosn-service --lib managed_retention --locked && soldr cargo test -p bosn-service --lib protocol_surface_is_pinned --locked"

# The machine-wide shared engine (#544, #547); reuses the isolated test stack.
[task.shared-engine-test]
stack = "test"
cmd = "soldr toolchain ensure --json && soldr cargo test -p bosn-service --lib --locked -- ci::lifecycle ci::machine ci::spare ci::shared_engine"
